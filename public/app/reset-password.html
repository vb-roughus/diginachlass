<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Passwort zurücksetzen – diginachlass.ch</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600&family=Hanken+Grotesk:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<header class="nav"><div class="nav-inner">
  <a class="brand" href="/">diginachlass<span class="tld">.ch</span></a>
  <nav class="nav-links"><a href="/">← Startseite</a><a href="/app/login.html">Anmelden</a></nav>
</div></header>

<main><div class="auth-shell">
  <span class="eyebrow">Passwort</span>
  <h1 id="title">Passwort zurücksetzen</h1>
  <p class="lede" id="lede">Geben Sie Ihre E-Mail-Adresse ein – wir senden Ihnen einen Link.</p>

  <div class="card">
    <div class="alert" id="alert"></div>

    <!-- Schritt 1: Anfrage -->
    <form id="request-form" novalidate>
      <div class="field">
        <label for="email">E-Mail-Adresse</label>
        <input type="email" id="email" autocomplete="email" required>
      </div>
      <button class="btn btn-primary btn-block" type="submit" id="request-btn">Link anfordern</button>
    </form>

    <!-- Schritt 2: Neues Passwort -->
    <form id="confirm-form" novalidate style="display:none">
      <div class="field">
        <label for="password">Neues Passwort</label>
        <input type="password" id="password" autocomplete="new-password" required>
        <div class="hint">Mindestens 10 Zeichen, mit Gross-, Kleinbuchstabe und Ziffer.</div>
      </div>
      <button class="btn btn-primary btn-block" type="submit" id="confirm-btn">Passwort speichern</button>
    </form>
  </div>

  <div class="links"><a href="/app/login.html">Zurück zur Anmeldung</a></div>
</div></main>

<footer class="foot">© 2026 diginachlass.ch · <a href="/impressum.html">Impressum</a> · <a href="/datenschutz.html">Datenschutz</a></footer>

<script src="/assets/app.js"></script>
<script>
const { api, $, showAlert, fieldErrors } = window.DNL;
const alert = $('#alert');
const token = new URLSearchParams(location.search).get('token');

if (token) {
  $('#title').textContent = 'Neues Passwort festlegen';
  $('#lede').textContent = 'Wählen Sie ein neues, sicheres Passwort.';
  $('#request-form').style.display = 'none';
  $('#confirm-form').style.display = 'block';

  $('#confirm-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = $('#confirm-btn'); btn.disabled = true;
    try {
      const res = await api('/auth/password-reset/confirm', {
        method: 'POST', body: { token, password: $('#password').value },
      });
      $('#confirm-form').style.display = 'none';
      showAlert(alert, 'ok', res.message + ' Sie werden weitergeleitet …');
      setTimeout(() => location.href = '/app/login.html', 1800);
    } catch (err) { showAlert(alert, 'error', fieldErrors(err)); btn.disabled = false; }
  });
} else {
  $('#request-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = $('#request-btn'); btn.disabled = true;
    try {
      const res = await api('/auth/password-reset/request', {
        method: 'POST', body: { email: $('#email').value.trim() },
      });
      $('#request-form').style.display = 'none';
      showAlert(alert, 'ok', res.message);
    } catch (err) { showAlert(alert, 'error', fieldErrors(err)); btn.disabled = false; }
  });
}
</script>
</body>
</html>

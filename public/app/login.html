<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anmelden – diginachlass.ch</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600&family=Hanken+Grotesk:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<header class="nav"><div class="nav-inner">
  <a class="brand" href="/">diginachlass<span class="tld">.ch</span></a>
  <nav class="nav-links"><a href="/">← Startseite</a><a href="/app/register.html">Registrieren</a></nav>
</div></header>

<main><div class="auth-shell">
  <span class="eyebrow">Willkommen zurück</span>
  <h1>Anmelden</h1>
  <p class="lede">Melden Sie sich an, um Ihr Compendium zu verwalten.</p>

  <div class="card">
    <div class="alert" id="alert"></div>
    <form id="form" novalidate>
      <div class="field">
        <label for="email">E-Mail-Adresse</label>
        <input type="email" id="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="password">Passwort</label>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>
      <div class="field" id="totp-field" style="display:none">
        <label for="totp">Bestätigungscode (2FA)</label>
        <input type="text" id="totp" inputmode="numeric" autocomplete="one-time-code" class="mono">
        <div class="hint">Geben Sie den 6-stelligen Code aus Ihrer Authenticator-App ein.</div>
      </div>
      <button class="btn btn-primary btn-block" type="submit" id="submit">Anmelden</button>
    </form>
  </div>

  <div class="links">
    <a href="/app/reset-password.html">Passwort vergessen?</a>
    <span>Neu hier? <a href="/app/register.html">Konto erstellen</a></span>
  </div>
</div></main>

<footer class="foot">© 2026 diginachlass.ch · <a href="/impressum.html">Impressum</a> · <a href="/datenschutz.html">Datenschutz</a></footer>

<script src="/assets/app.js"></script>
<script>
const { api, $, showAlert, fieldErrors } = window.DNL;
const form = $('#form'), alert = $('#alert'), btn = $('#submit');
const params = new URLSearchParams(location.search);
const redirect = params.get('next') || '/app/account.html';
let twoFactor = false;

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  btn.disabled = true;
  try {
    const body = { email: $('#email').value.trim(), password: $('#password').value };
    const totp = $('#totp').value.trim();
    if (twoFactor && totp) body.totp = totp;
    const res = await api('/auth/login', { method: 'POST', body });
    if (res.twoFactorRequired) {
      twoFactor = true;
      $('#totp-field').style.display = 'block';
      $('#totp').focus();
      showAlert(alert, 'info', res.message);
      btn.disabled = false;
      return;
    }
    location.href = redirect;
  } catch (err) {
    showAlert(alert, 'error', fieldErrors(err));
    btn.disabled = false;
  }
});
</script>
</body>
</html>
